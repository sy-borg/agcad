[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/server",
    "crates/viewer",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wright-protocol = { path = "crates/protocol" }
wright-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
