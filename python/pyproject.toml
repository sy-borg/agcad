[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agcad"
version = "0.1.0"
description = "Python client for agcad — a CAD built for AI agents"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["agcad"]

[project.scripts]
agcad-mcp = "agcad.mcp_server:main"
