<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- agcad logo: a snowman assembled from primitives, like the tool itself.
       Geometry mirrors the parametric program: 3 spheres + cylinder nose +
       box hat, standing on a CAD grid line. -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256" rx="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- tile -->
    <rect width="256" height="256" fill="#2b3444"/>

    <!-- CAD ground grid -->
    <line x1="24" y1="224" x2="232" y2="224" stroke="#4a5870" stroke-width="2"/>
    <g stroke="#4a5870" stroke-width="2" opacity="0.55">
      <line x1="48"  y1="218" x2="48"  y2="230"/>
      <line x1="72"  y1="218" x2="72"  y2="230"/>
      <line x1="96"  y1="218" x2="96"  y2="230"/>
      <line x1="128" y1="218" x2="128" y2="230"/>
      <line x1="160" y1="218" x2="160" y2="230"/>
      <line x1="184" y1="218" x2="184" y2="230"/>
      <line x1="208" y1="218" x2="208" y2="230"/>
    </g>

    <!-- construction crosshair on the head (CAD sketch lines) -->
    <g stroke="#d7dde6" stroke-width="1.5" opacity="0.22">
      <line x1="96"  y1="86" x2="160" y2="86"/>
      <line x1="128" y1="54" x2="128" y2="118"/>
    </g>

    <!-- arms (behind the torso, twig-stick style) -->
    <g stroke="#a4763e" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="97"  y1="120" x2="63" y2="97"/>
      <line x1="159" y1="120" x2="193" y2="97"/>
      <!-- little twig fingers -->
      <line x1="72"  y1="103" x2="65" y2="111"/>
      <line x1="184" y1="103" x2="191" y2="111"/>
    </g>

    <!-- body, torso, head: three matte-white spheres -->
    <circle cx="128" cy="176" r="44" fill="#f5f7fa"/>
    <circle cx="128" cy="124" r="33" fill="#f5f7fa"/>
    <circle cx="128" cy="84"  r="24" fill="#f5f7fa"/>

    <!-- scarf: one red box, like the family's kid -->
    <rect x="106" y="102" width="44" height="11" rx="5.5" fill="#c4453d"/>

    <!-- top hat: brim + crown boxes -->
    <rect x="99"  y="57" width="58" height="9" rx="4.5" fill="#1f2632"/>
    <rect x="107" y="26" width="42" height="34" rx="4"   fill="#1f2632"/>

    <!-- eyes: two tiny dark spheres -->
    <circle cx="119" cy="80" r="3.4" fill="#1f2632"/>
    <circle cx="137" cy="80" r="3.4" fill="#1f2632"/>

    <!-- nose: an orange cylinder seen from the side -->
    <rect x="139" y="87" width="23" height="6.5" rx="3.25" fill="#e8833a"/>
    <circle cx="161" cy="90.25" r="3.25" fill="#f29a55"/>

    <!-- buttons on the torso -->
    <circle cx="128" cy="115" r="3.2" fill="#1f2632"/>
    <circle cx="128" cy="131" r="3.2" fill="#1f2632"/>
  </g>
</svg>
